# ==============================================================================
# SUPERMARKET CHAIN MANAGEMENT SYSTEM (ICT3222 ADBMS)
# Spring Boot 3 + Spring JDBC (No ORM / Hibernate) Configuration
# ==============================================================================

# Application & Server Information
spring.application.name=backend
server.port=8080
# Controllers already include the /api prefix used by the Angular proxy.

# ------------------------------------------------------------------------------
# 1. DATABASE CONNECTION (MySQL 8.0 InnoDB)
# Environment variables allow zero-code containerization via Docker / .env
# ------------------------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:supermarket_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:Prabashi@2003}}

# -------------------------------------------------------------------------------
# 2. DATABASE MIGRATIONS
# Existing databases are baselined at version 0, then versioned migrations run.
# -------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------------------
# 2. HIKARI CONNECTION POOLING (Member 5 & Coursework Section 11)
# High-concurrency tuning for POS and analytical query execution
# ------------------------------------------------------------------------------
spring.datasource.hikari.pool-name=SupermarketHikariCP
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000

# ------------------------------------------------------------------------------
# 3. SECURITY & JWT (JSON WEB TOKEN) SPECIFICATIONS
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity: 24 Hours (86,400,000 milliseconds)
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------------------------
# 4. CORS CONFIGURATION (Frontend Angular Integration)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# ------------------------------------------------------------------------------
# 5. LOGGING CONFIGURATION
# Debugging stored procedure calls and SQL execution parameters
# ------------------------------------------------------------------------------
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.lk.supermarket=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.simple.SimpleJdbcCall=DEBUG
logging.level.org.springframework.security=INFO
