spring.application.name=backend
server.port=8080

# ==============================================================================
# MySQL Database Configuration
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:supermarket_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:K1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# HikariCP Pool Configuration
# initialization-fail-timeout=-1 allows the app to start even if MySQL is starting or temporarily offline
# ==============================================================================
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==============================================================================
# Security & JWT Configuration
# ==============================================================================
jwt.secret=${JWT_SECRET:supermarket_secret_key_ict3222_adbms_project_2026_at_least_256_bits_long!}
jwt.expiration=${JWT_EXPIRATION:86400000}
